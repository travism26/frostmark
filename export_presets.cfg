html/head_include="<script>/* Frostmark: draw the canvas at no more than 1.5 device pixels per CSS pixel. Godot sizes the canvas and maps the mouse by window.devicePixelRatio, so capping it here cuts the pixels rendered on Retina screens by 44% and keeps clicks lined up. */(function () { var cap = 1.5; var real = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio') || Object.getOwnPropertyDescriptor(Window.prototype, 'devicePixelRatio'); if (!real || !real.get) { return; } Object.defineProperty(window, 'devicePixelRatio', { configurable: true, get: function () { return Math.min(cap, real.get.call(window)); } }); })();</script>"
